[project]
name = "llm-wiki"
version = "0.1.0"
description = "A CLI tool for LLM Wiki management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pymysql>=1.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "chonkie>=0.1.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
    "pymupdf>=1.27.2.2",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "mypy>=2.0.0",
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-mock>=3.14.0",
    "ruff>=0.15.12",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src --cov-report=term-missing --cov-fail-under=80"
