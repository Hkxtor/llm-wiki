[project]
name = "llm-wiki"
version = "0.1.0"
description = "A CLI tool for LLM Wiki management"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "pymysql>=1.1.0",
    "openai>=1.0.0",
    "python-dotenv>=1.0.0",
    "chonkie>=0.1.0",
    "tqdm>=4.66.0",
    "tiktoken>=0.7.0",
    "pymupdf>=1.27.2.2",
]

[project.scripts]
llm-wiki = "llm_wiki.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
